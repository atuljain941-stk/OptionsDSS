<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Black-Scholes Model Backtest</title>
  <style>
    body{font-family:Arial,sans-serif;background:#101827;color:#e5e7eb;margin:0;padding:24px}
    .card{max-width:1100px;margin:auto;background:#172235;border:1px solid #334155;border-radius:12px;padding:20px}
    h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
    label{font-size:12px;color:#aab7ca;display:block;margin-bottom:4px}input,select,button{width:100%;box-sizing:border-box;padding:9px;border-radius:6px;border:1px solid #475569;background:#0f172a;color:#fff}
    button{background:#2563eb;border:0;cursor:pointer;margin-top:18px}.muted{color:#94a3b8;font-size:13px}.status{margin:16px 0;color:#93c5fd}
    table{border-collapse:collapse;width:100%;font-size:12px;margin-top:15px}th,td{border-bottom:1px solid #334155;padding:7px;text-align:right}th:first-child,td:first-child{text-align:left}
    pre{white-space:pre-wrap;background:#0b1220;padding:12px;border-radius:8px;overflow:auto}
  </style>
</head>
<body>
<div class="card">
  <h1>Black-Scholes Model Backtest</h1>
  <p class="muted">Theoretical entry premiums from historical spot and IV. Expiry P&amp;L uses the stored underlying price; this is not a historical bid/ask fill backtest.</p>
  <form id="form">
    <div class="grid">
      <div><label>Symbol</label><input id="symbol" value="SPY" required></div>
      <div><label>Start date</label><input id="start" type="date" required></div>
      <div><label>End date</label><input id="end" type="date" required></div>
      <div><label>Entry cadence</label><select id="entry"><option value="every_friday">Every Friday</option><option value="every_day">Every trading day</option></select></div>
      <div><label>Expiry</label><select id="expiry"><option value="next_friday">Following Friday</option><option value="fixed_dte">Fixed DTE</option></select></div>
      <div><label>Strategy</label><select id="strategy"><option value="iron_fly">Iron Fly</option><option value="iron_condor">Iron Condor</option><option value="strangle">Short Strangle</option><option value="straddle">Short Straddle</option><option value="bull_put">Bull Put Spread</option><option value="bear_call">Bear Call Spread</option></select></div>
      <div><label>Wing width ($)</label><input id="width" type="number" step="0.5" value="15"></div>
      <div><label>Short delta</label><input id="delta" type="number" step="0.01" value="0.16"></div>
      <div><label>Slippage (%)</label><input id="slippage" type="number" step="0.01" value="0"></div>
    </div>
    <button type="submit">Start Backtest</button>
  </form>
  <div id="status" class="status"></div>
  <pre id="summary">No run yet.</pre>
  <div id="trades"></div>
</div>
<script>
const iso = d => d.toISOString().slice(0,10);
const now = new Date(); document.querySelector('#end').value = iso(now);
const prior = new Date(now); prior.setFullYear(prior.getFullYear()-1); document.querySelector('#start').value = iso(prior);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function strategy(){
  const type=document.querySelector('#strategy').value, width=Number(document.querySelector('#width').value), delta=Number(document.querySelector('#delta').value);
  if(type==='iron_fly') return {type, short_strike:{type:'atm'}, wing_width:width};
  if(type==='iron_condor') return {type, short_put:{type:'delta',value:delta}, short_call:{type:'delta',value:delta}, wing_width:width};
  if(type==='strangle') return {type, short_put:{type:'delta',value:delta}, short_call:{type:'delta',value:delta}};
  if(type==='bull_put') return {type, short_put:{type:'delta',value:delta}, wing_width:width};
  if(type==='bear_call') return {type, short_call:{type:'delta',value:delta}, wing_width:width};
  return {type};
}
async function poll(id){
  const r=await fetch('/model-backtest/api/runs/'+id), d=await r.json();
  document.querySelector('#status').textContent=`Run ${id}: ${d.status} (${d.progress || 0}%)`;
  if(d.status==='running'){setTimeout(()=>poll(id),1500);return;}
  document.querySelector('#summary').textContent=JSON.stringify(d.summary || d.error || {},null,2);
  const rows=d.trades||[]; document.querySelector('#trades').innerHTML=rows.length ? '<table><thead><tr><th>Entry</th><th>Expiry</th><th>Spot</th><th>IV</th><th>Credit</th><th>Expiry Spot</th><th>P&amp;L</th><th>Outcome</th></tr></thead><tbody>'+rows.map(t=>`<tr><td>${esc(t.entry_date)}</td><td>${esc(t.expiry_date)}</td><td>${Number(t.entry_spot).toFixed(2)}</td><td>${(Number(t.iv)*100).toFixed(1)}%</td><td>${Number(t.credit).toFixed(2)}</td><td>${Number(t.expiry_spot).toFixed(2)}</td><td>${Number(t.pnl_dollars).toFixed(2)}</td><td>${esc(t.outcome)}</td></tr>`).join('')+'</tbody></table>' : '<p class="muted">No completed trades. Check that stored price history covers the requested period.</p>';
}
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();document.querySelector('#status').textContent='Starting…';
 const payload={run_name:'Model backtest '+document.querySelector('#symbol').value, symbol:document.querySelector('#symbol').value, start_date:document.querySelector('#start').value, end_date:document.querySelector('#end').value, entry_rule:{type:document.querySelector('#entry').value}, expiry_rule:{type:document.querySelector('#expiry').value}, strategy:strategy(), slippage_pct:Number(document.querySelector('#slippage').value), iv_source:'historical_iv'};
 const r=await fetch('/model-backtest/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}), d=await r.json(); if(!r.ok){document.querySelector('#status').textContent=d.error||'Could not start';return;} poll(d.run_id);
});
</script>
</body>
</html>
