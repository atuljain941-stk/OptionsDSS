{% extends "base.html" %} {% block content %}

<div class="container mt-4">
  <h3>🧮 SQL Viewer</h3>
  <p class="text-muted">
    Run read-only SQL queries against <b>options_data.db</b>.
  </p>

  <div class="mb-3">
    <textarea
      id="sql-query"
      class="form-control"
      rows="6"
      placeholder="Example: SELECT symbol, expiration, strike, oi FROM options_oi LIMIT 10;"
    ></textarea>
  </div>

  <div class="d-flex mb-3">
    <button class="btn btn-primary me-2" onclick="runSQL()">▶ Run Query</button>
    <button class="btn btn-secondary" onclick="clearResults()">🧹 Clear</button>
  </div>

  <div id="query-status"></div>
  <div id="query-results" class="table-responsive mt-3"></div>
</div>

<script>
  async function runSQL() {
    const query = document.getElementById("sql-query").value.trim();
    const status = document.getElementById("query-status");
    const resultsDiv = document.getElementById("query-results");

    status.innerHTML = `<span class="text-info">Running query...</span>`;
    resultsDiv.innerHTML = "";

    try {
      const res = await fetch("/api/run_sql", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query }),
      });
      const data = await res.json();

      if (!res.ok) {
        status.innerHTML = `<span class="text-danger">Error: ${data.error}</span>`;
        return;
      }

      if (!data.rows.length) {
        status.innerHTML = `<span class="text-warning">No results found.</span>`;
        resultsDiv.innerHTML = "";
        return;
      }

      // Build table
      const cols = data.columns;
      let html =
        "<table class='table table-sm table-striped table-bordered'><thead><tr>";
      for (const c of cols) html += `<th>${c}</th>`;
      html += "</tr></thead><tbody>";
      for (const row of data.rows) {
        html += "<tr>";
        for (const val of row) html += `<td>${val ?? ""}</td>`;
        html += "</tr>";
      }
      html += "</tbody></table>";
      resultsDiv.innerHTML = html;

      status.innerHTML = `<span class="text-success">✅ Query executed successfully (${data.rows.length} rows)</span>`;
    } catch (err) {
      status.innerHTML = `<span class="text-danger">Error: ${err.message}</span>`;
    }
  }

  function clearResults() {
    document.getElementById("sql-query").value = "";
    document.getElementById("query-results").innerHTML = "";
    document.getElementById("query-status").innerHTML = "";
  }
</script>

{% endblock %}

<script src="/static/panel_tools.js"></script>
