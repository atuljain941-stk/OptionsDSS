<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Charts</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/theme_uplift.css"/>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    :root{
      --bg:#0f172a; --card:#172033; --card2:#101827; --text:#e5e7eb; --muted:#94a3b8;
      --line:rgba(148,163,184,.18); --good:#22c55e; --warn:#f59e0b; --bad:#ef4444; --accent:#818cf8;
    }
    body{margin:0;background:linear-gradient(180deg,#0b1120,#111827);color:var(--text);font-family:Inter,Arial,sans-serif}
    .wrap{max-width:1600px;margin:0 auto;padding:16px}
    .topbar{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:12px}
    .title{font-size:24px;font-weight:900;letter-spacing:.01em}
    .subtitle{color:var(--muted);margin-top:4px;font-size:12px;line-height:1.5}
    .toolbar{background:rgba(23,32,51,.95);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:1.1fr .8fr .8fr 1.2fr auto;gap:10px;align-items:end;box-shadow:0 10px 30px rgba(0,0,0,.24)}
    label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
    input,select,button{font:inherit}
    input,select{width:100%;background:rgba(8,12,24,.7);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 12px;outline:none}
    button{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700}
    .btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white}
    .btn-ghost{background:rgba(8,12,24,.7);color:var(--text);border:1px solid var(--line)}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .chip{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(129,140,248,.25);background:rgba(8,12,24,.65);color:var(--text);border-radius:999px;padding:8px 12px;font-size:12px}
    .chip .x{cursor:pointer;color:var(--muted);font-weight:900}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
    .card{background:rgba(23,32,51,.92);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.24)}
    .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
    .panel-title{font-size:18px;font-weight:900}
    .panel-sub{color:var(--muted);font-size:11px;margin-top:4px}
    .chart{width:100%;height:480px}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
    .stat{background:rgba(8,12,24,.55);border:1px solid rgba(148,163,184,.12);border-radius:12px;padding:10px}
    .stat .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
    .stat .v{font-size:13px;font-weight:800;margin-top:4px}
    .legend{color:var(--muted);font-size:11px;line-height:1.6}
    .pick-row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
    .badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800;border:1px solid rgba(148,163,184,.25);background:rgba(255,255,255,.03);color:#cbd5e1}
    .loading{color:var(--muted);font-size:12px}
    @media (max-width: 1100px){ .toolbar{grid-template-columns:1fr 1fr} .grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="title">Price Charts & Primitives</div>
        <div class="subtitle">Multi-timeframe validation workspace. Pick primitives, compare Monthly / Weekly / Daily / Intraday, and overlay support, resistance, and OI walls.</div>
      </div>
      <div style="text-align:right">
        <div class="badge" id="active-spot">Spot: —</div><br/>
        <div class="badge" id="active-walls">Walls: —</div>
      </div>
    </div>

    <div class="toolbar">
      <div>
        <label>Symbol</label>
        <input id="symbol" value="SPY" />
      </div>
      <div>
        <label>Expiry (for OI walls)</label>
        <input id="expiry" placeholder="optional" />
      </div>
      <div>
        <label>Add Primitive</label>
        <select id="primitive-select"></select>
      </div>
      <div>
        <label>Chart Preset</label>
        <select id="preset-select">
          <option value="monthly-weekly-daily-intraday">Monthly / Weekly / Daily / Intraday</option>
          <option value="weekly-daily-4h-1h">Weekly / Daily / 4H / 1H</option>
          <option value="daily-4h-1h-15m">Daily / 4H / 1H / 15M</option>
        </select>
      </div>
      <div class="pick-row">
        <button id="add-primitive" class="btn-ghost" type="button">Add</button>
        <button id="refresh" class="btn-primary" type="button">Refresh</button>
      </div>
    </div>

    <div id="chips" class="chips"></div>

    <div class="grid">
      <div class="card">
        <div class="card-head">
          <div>
            <div class="panel-title"><select class="tf-select" data-panel="0"></select></div>
            <div class="panel-sub" id="sub-0">—</div>
          </div>
          <div class="legend" id="legend-0">—</div>
        </div>
        <div id="chart-0" class="chart"></div>
        <div class="stats" id="stats-0"></div>
      </div>
      <div class="card">
        <div class="card-head">
          <div>
            <div class="panel-title"><select class="tf-select" data-panel="1"></select></div>
            <div class="panel-sub" id="sub-1">—</div>
          </div>
          <div class="legend" id="legend-1">—</div>
        </div>
        <div id="chart-1" class="chart"></div>
        <div class="stats" id="stats-1"></div>
      </div>
      <div class="card">
        <div class="card-head">
          <div>
            <div class="panel-title"><select class="tf-select" data-panel="2"></select></div>
            <div class="panel-sub" id="sub-2">—</div>
          </div>
          <div class="legend" id="legend-2">—</div>
        </div>
        <div id="chart-2" class="chart"></div>
        <div class="stats" id="stats-2"></div>
      </div>
      <div class="card">
        <div class="card-head">
          <div>
            <div class="panel-title"><select class="tf-select" data-panel="3"></select></div>
            <div class="panel-sub" id="sub-3">—</div>
          </div>
          <div class="legend" id="legend-3">—</div>
        </div>
        <div id="chart-3" class="chart"></div>
        <div class="stats" id="stats-3"></div>
      </div>
    </div>
  </div>
  <script src="/static/charts.js"></script>
  <script src="/static/panel_tools.js"></script>
</body>
</html>
