<div class="container-fluid mt-3">
  <h4 class="mb-3">📊 Option Flow Scanners</h4>

  <!-- ── Scanner Buttons ──────────────────────────────────────────── -->
  <div class="d-flex flex-wrap gap-2 mb-3 align-items-center">
    <button class="btn btn-primary"  onclick="runScanner('large_oi')">🔥 OI Buildup / Unwind</button>
    <button class="btn btn-warning"  onclick="runScanner('pcr_change')">📉 PCR Change</button>
    <button class="btn btn-success"  onclick="runScanner('weekly_pin')">📌 Weekly / Monthly Pin</button>
    <button class="btn btn-secondary" onclick="showWallMap()">🧱 OI Wall Map</button>
    <button class="btn btn-info"     onclick="runScanner('scan_condors_btn')" disabled id="btn_condors">Iron Condor Scan ↗</button>
  </div>

  <!-- ── Parameter Panel ──────────────────────────────────────────── -->
  <div class="card mb-3 p-3 bg-light">
    <div class="row g-2 align-items-end">
      <div class="col-auto">
        <label class="form-label small mb-0">Min OI Δ (abs)</label>
        <input id="param_min_abs" type="number" class="form-control form-control-sm" value="1000" style="width:90px">
      </div>
      <div class="col-auto">
        <label class="form-label small mb-0">Min OI Δ (%)</label>
        <input id="param_min_pct" type="number" class="form-control form-control-sm" value="15" style="width:70px">
      </div>
      <div class="col-auto">
        <label class="form-label small mb-0">Max DTE</label>
        <input id="param_max_dte" type="number" class="form-control form-control-sm" value="60" style="width:70px">
      </div>
      <div class="col-auto">
        <label class="form-label small mb-0">PCR Δ Threshold (%)</label>
        <input id="param_pcr_thr" type="number" class="form-control form-control-sm" value="10" style="width:80px">
      </div>
      <div class="col-auto">
        <label class="form-label small mb-0">Wall Map Symbol</label>
        <input id="param_wall_sym" type="text"   class="form-control form-control-sm" value="SPY" style="width:80px">
      </div>
    </div>
  </div>

  <!-- ── Legend ───────────────────────────────────────────────────── -->
  <div class="mb-2 small text-muted">
    <b>Signal Score:</b> 0–100 composite rank &nbsp;|&nbsp;
    <b>Grade A</b> ≥75 &nbsp;<b>B</b> ≥50 &nbsp;<b>C</b> &lt;50 &nbsp;|&nbsp;
    <b>IVP Proxy</b> = 30d HV percentile (free, from yfinance) &nbsp;|&nbsp;
    <b>Wall</b> = highest OI strike in that leg &nbsp;|&nbsp;
    <span class="badge bg-success">Put Support</span>
    <span class="badge bg-danger">Call Resistance</span>
  </div>

  <!-- ── Results Table ────────────────────────────────────────────── -->
  <div id="scanner-status" class="text-muted small mb-1"></div>
  <div id="scanner-results" style="overflow-x:auto"></div>
</div>

<style>
  .grade-A  { background:#d4edda!important; font-weight:700; }
  .grade-B  { background:#fff3cd!important; }
  .grade-C  { background:#f8d7da!important; }
  .wall-yes { color:#0d6efd; font-weight:600; }
  .score-hi { color:#198754; font-weight:700; }
  .score-lo { color:#dc3545; }
  .tbl-scan th { white-space:nowrap; cursor:pointer; user-select:none; }
  .tbl-scan td { white-space:nowrap; font-size:0.82rem; }
  .filter-row input { width:100%; font-size:0.75rem; padding:1px 4px; }
</style>

<script>
/* ── utility ─────────────────────────────────────────── */
function fmt(v, decimals=2) {
  if (v === null || v === undefined) return "—";
  if (typeof v === "boolean")  return v ? "✔" : "";
  if (typeof v === "number")   return Number.isInteger(v) ? v.toLocaleString() : v.toFixed(decimals);
  return v;
}

function gradeClass(r) {
  if (r.grade === "A") return "grade-A";
  if (r.grade === "B") return "grade-B";
  return "grade-C";
}

function scoreClass(s) {
  if (!s) return "";
  return s >= 75 ? "score-hi" : s < 40 ? "score-lo" : "";
}

/* ── column configs for each scanner ────────────────── */
const COLS = {
  large_oi: [
    {k:"signal_score",  h:"Score",     fmt: v=>fmt(v,0)},
    {k:"grade",         h:"Grade"},
    {k:"symbol",        h:"Symbol"},
    {k:"expiry",        h:"Expiry"},
    {k:"expiry_type",   h:"Type"},
    {k:"dte",           h:"DTE"},
    {k:"type",          h:"P/C"},
    {k:"strike",        h:"Strike",    fmt:v=>fmt(v,0)},
    {k:"spot",          h:"Spot",      fmt:v=>fmt(v,2)},
    {k:"sr_label",      h:"S/R Label"},
    {k:"is_wall",       h:"Wall?",     fmt:v=>v?"🧱":""},
    {k:"direction",     h:"Direction"},
    {k:"oi_prev",       h:"OI Prev",   fmt:v=>fmt(v,0)},
    {k:"oi_now",        h:"OI Now",    fmt:v=>fmt(v,0)},
    {k:"oi_change",     h:"OI Δ",      fmt:v=>fmt(v,0)},
    {k:"pct_change",    h:"% Δ",       fmt:v=>fmt(v,2)},
    {k:"vol_confirmed", h:"Vol Conf?", fmt:v=>v?"✔":""},
  ],
  pcr_change: [
    {k:"signal_score",  h:"Score",    fmt:v=>fmt(v,0)},
    {k:"symbol",        h:"Symbol"},
    {k:"expiry",        h:"Expiry"},
    {k:"expiry_type",   h:"Type"},
    {k:"dte",           h:"DTE"},
    {k:"pcr_prev",      h:"PCR Prev", fmt:v=>fmt(v,3)},
    {k:"pcr_now",       h:"PCR Now",  fmt:v=>fmt(v,3)},
    {k:"pct_change",    h:"PCR Δ%",   fmt:v=>fmt(v,2)},
    {k:"direction",     h:"Direction"},
    {k:"regime",        h:"Regime"},
    {k:"divergence",    h:"Divergence"},
    {k:"now_puts",      h:"Now Puts",  fmt:v=>fmt(v,0)},
    {k:"now_calls",     h:"Now Calls", fmt:v=>fmt(v,0)},
  ],
  weekly_pin: [
    {k:"signal_score",    h:"Score",      fmt:v=>fmt(v,0)},
    {k:"scan_type",       h:"Scan Type"},
    {k:"symbol",          h:"Symbol"},
    {k:"expiry",          h:"Expiry"},
    {k:"dte",             h:"DTE"},
    {k:"spot",            h:"Spot",       fmt:v=>fmt(v,2)},
    {k:"pin_strike",      h:"Pin Strike", fmt:v=>fmt(v,0)},
    {k:"pin_dist_$",      h:"Dist $",     fmt:v=>fmt(v,2)},
    {k:"pin_dist_%",      h:"Dist %",     fmt:v=>fmt(v,2)},
    {k:"total_pin_oi",    h:"Pin OI",     fmt:v=>fmt(v,0)},
    {k:"pin_put_oi",      h:"Put OI",     fmt:v=>fmt(v,0)},
    {k:"pin_call_oi",     h:"Call OI",    fmt:v=>fmt(v,0)},
    {k:"window_pcr",      h:"PCR",        fmt:v=>fmt(v,3)},
    {k:"inside_exp_move", h:"In EM?",     fmt:v=>v?"✔":"✗"},
    {k:"exp_move_1sd",    h:"1SD Move",   fmt:v=>fmt(v,2)},
    {k:"trade_idea",      h:"Trade Idea"},
  ],
};

/* ── sortable table builder ──────────────────────────── */
let _sortCol = null, _sortDir = 1, _lastData = [], _lastCols = [];

function buildTable(data, colDefs) {
  _lastData = data; _lastCols = colDefs;
  if (!data.length) { document.getElementById("scanner-results").innerHTML = "<p class='text-muted'>No results.</p>"; return; }

  let html = "<table class='table table-sm table-bordered tbl-scan'><thead>";
  html += "<tr>" + colDefs.map((c,i) => `<th onclick="sortTable(${i})">${c.h} <span style='font-size:0.6em'>▲▼</span></th>`).join("") + "</tr>";
  html += "<tr class='filter-row'>" + colDefs.map(c => `<td><input type='text' onkeyup='filterTable()' placeholder='…'></td>`).join("") + "</tr>";
  html += "</thead><tbody id='tbl-body'>";
  html += renderRows(data, colDefs);
  html += "</tbody></table>";
  document.getElementById("scanner-results").innerHTML = html;
}

function renderRows(data, colDefs) {
  return data.map(r => {
    const gc = gradeClass(r);
    const cells = colDefs.map(c => {
      const v = r[c.k];
      const disp = c.fmt ? c.fmt(v) : (v === null || v === undefined ? "—" : v);
      const sc = c.k === "signal_score" ? ` class="${scoreClass(v)}"` : "";
      return `<td${sc}>${disp}</td>`;
    }).join("");
    return `<tr class="${gc}">${cells}</tr>`;
  }).join("");
}

function sortTable(colIdx) {
  const key = _lastCols[colIdx].k;
  if (_sortCol === key) _sortDir *= -1; else { _sortCol = key; _sortDir = -1; }
  _lastData.sort((a,b) => {
    const va = a[key], vb = b[key];
    if (va === null || va === undefined) return 1;
    if (vb === null || vb === undefined) return -1;
    return (va < vb ? -1 : va > vb ? 1 : 0) * _sortDir;
  });
  document.getElementById("tbl-body").innerHTML = renderRows(_lastData, _lastCols);
}

function filterTable() {
  const inputs = document.querySelectorAll(".filter-row input");
  const filters = Array.from(inputs).map(i => i.value.toLowerCase());
  const tbody = document.getElementById("tbl-body");
  if (!tbody) return;
  const rows = tbody.querySelectorAll("tr");
  rows.forEach(tr => {
    const cells = tr.querySelectorAll("td");
    const show = filters.every((f,i) => !f || (cells[i] && cells[i].textContent.toLowerCase().includes(f)));
    tr.style.display = show ? "" : "none";
  });
}

/* ── main scanner runner ─────────────────────────────── */
async function runScanner(type) {
  const status = document.getElementById("scanner-status");
  const div    = document.getElementById("scanner-results");
  status.textContent = `⏳ Running ${type}...`;
  div.innerHTML = "";

  let url, colDefs;
  const min_abs = document.getElementById("param_min_abs").value;
  const min_pct = document.getElementById("param_min_pct").value;
  const max_dte = document.getElementById("param_max_dte").value;
  const pcr_thr = document.getElementById("param_pcr_thr").value;

  if (type === "large_oi") {
    url = `scanner/large_oi?min_abs=${min_abs}&min_pct=${min_pct}&max_dte=${max_dte}`;
    colDefs = COLS.large_oi;
  } else if (type === "pcr_change") {
    url = `scanner/pcr_change?threshold=${pcr_thr}&max_dte=${max_dte}`;
    colDefs = COLS.pcr_change;
  } else if (type === "weekly_pin") {
    url = `scanner/weekly_pin?monthly=true`;
    colDefs = COLS.weekly_pin;
  } else {
    status.textContent = "Unknown scanner type.";
    return;
  }

  try {
    const resp = await fetch(url);
    const data = await resp.json();
    status.textContent = `✅ ${data.length} result(s)  |  sorted by Signal Score desc`;
    buildTable(data, colDefs);
  } catch(e) {
    status.textContent = "❌ Error: " + e.message;
  }
}

/* ── OI Wall Map ─────────────────────────────────────── */
async function showWallMap() {
  const sym = document.getElementById("param_wall_sym").value.toUpperCase() || "SPY";
  const max_dte = document.getElementById("param_max_dte").value;
  const div = document.getElementById("scanner-results");
  const status = document.getElementById("scanner-status");
  status.textContent = `⏳ Loading OI Wall Map for ${sym}…`;
  div.innerHTML = "";

  const resp = await fetch(`scanner/oi_wall_map?symbol=${sym}&max_dte=${max_dte}`);
  const d = await resp.json();
  if (d.error) { status.textContent = "❌ " + d.error; return; }

  const makeWallTable = (walls, label) => {
    if (!walls || !walls.length) return `<p class="text-muted small">No ${label} data</p>`;
    let h = `<h6>${label}</h6><table class="table table-sm table-bordered"><thead><tr>
      <th>Strike</th><th>Total OI</th><th>Expiry Breakdown</th></tr></thead><tbody>`;
    walls.forEach(w => {
      const breakdown = w.expiry_breakdown.map(e => `${e.expiry}(${e.oi.toLocaleString()})`).join(" | ");
      h += `<tr><td><b>${w.strike}</b></td><td>${w.total_oi.toLocaleString()}</td><td style="font-size:0.75rem">${breakdown}</td></tr>`;
    });
    return h + "</tbody></table>";
  };

  let pinch = "";
  if (d.pinch_zone) {
    const pz = d.pinch_zone;
    pinch = `<div class="alert alert-info mt-2"><b>🎯 Pinch Zone (IC Sweet Spot):</b>
      Put Wall ${pz.put_strike} (OI ${pz.put_oi.toLocaleString()}) ↔ Call Wall ${pz.call_strike} (OI ${pz.call_oi.toLocaleString()})
      — Width <b>${pz.width} pts</b> — Combined OI <b>${pz.combined_oi.toLocaleString()}</b></div>`;
  }

  status.textContent = `✅ OI Wall Map for ${sym} | Spot: ${d.spot} | Snapshot: ${d.snapshot}`;
  div.innerHTML = `
    <div class="row">
      <div class="col-md-6">${makeWallTable(d.put_walls,  "🟢 Put Walls (Support)")}</div>
      <div class="col-md-6">${makeWallTable(d.call_walls, "🔴 Call Walls (Resistance)")}</div>
    </div>
    ${pinch}
    <div class="small text-muted mt-1">
      🏋️ Gamma Wall (highest combined OI across all expiries): <b>${d.gamma_wall || "—"}</b>
    </div>`;
}
</script>

<script src="/static/panel_tools.js"></script>
