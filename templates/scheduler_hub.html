<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scheduler</title>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/theme_uplift.css"/>
  <style>
    :root {
      --sh-bg:#0f1424; --sh-border:rgba(148,163,184,.16); --sh-text:#e5eefc; --sh-muted:#7b8ab5;
      --sh-good:#22c55e; --sh-bad:#ef4444; --sh-accent:#7c9df8;
    }
    html,body { height:100%; }
    body { margin:0; background: linear-gradient(180deg, #0c1120 0%, #0f1424 100%); color: var(--sh-text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; font-size:14px; }
    * { box-sizing:border-box; }
    button, input, select { font: inherit; }
    .sh-shell { min-height:100vh; padding:16px; }
    .sh-card { background: rgba(28,36,56,.88); border:1px solid var(--sh-border); border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,.22); padding:14px; margin-bottom:14px; }
    .sh-brand { font-weight:900; font-size:20px; }
    .sh-sub { color:var(--sh-muted); font-size:13px; margin-top:2px; }
    .sh-group-title { font-weight:900; font-size:14px; color:#c7d2fe; margin:18px 0 8px; text-transform:uppercase; letter-spacing:.04em; }
    .sh-job { background: rgba(8,12,24,.4); border:1px solid var(--sh-border); border-radius:12px; padding:12px; margin-bottom:10px; }
    .sh-job-head { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .sh-job-title { font-weight:800; font-size:14px; display:flex; align-items:center; gap:10px; }
    .sh-job-desc { color:var(--sh-muted); font-size:12px; margin-top:4px; }
    .sh-job-meta { color:var(--sh-muted); font-size:11.5px; margin-top:6px; display:flex; gap:14px; flex-wrap:wrap; }
    .sh-switch { position:relative; display:inline-block; width:40px; height:22px; flex:0 0 auto; }
    .sh-switch input { opacity:0; width:0; height:0; }
    .sh-slider { position:absolute; cursor:pointer; inset:0; background:rgba(148,163,184,.28); border-radius:999px; transition:.15s; }
    .sh-slider::before { content:''; position:absolute; height:16px; width:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
    .sh-switch input:checked + .sh-slider { background: linear-gradient(180deg,#34d399,#22c55e); }
    .sh-switch input:checked + .sh-slider::before { transform: translateX(18px); }
    .sh-btn { border-radius:9px; border:1px solid var(--sh-border); background: linear-gradient(180deg, rgba(124,157,248,.28), rgba(124,157,248,.16)); color:var(--sh-text); padding:6px 11px; font-size:12px; font-weight:700; cursor:pointer; }
    .sh-btn:hover { filter:brightness(1.08); }
    .sh-btn:disabled { opacity:.5; cursor:not-allowed; }
    .sh-schedule-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; padding-top:10px; border-top:1px dashed var(--sh-border); }
    .sh-input { border-radius:8px; border:1px solid var(--sh-border); background: rgba(8,12,24,.7); color:var(--sh-text); padding:6px 9px; font-size:12px; }
    .sh-times-chip { display:inline-flex; align-items:center; gap:6px; background:rgba(124,157,248,.14); border-radius:999px; padding:3px 10px; font-size:12px; }
    .sh-times-chip button { background:none; border:none; color:#fca5a5; cursor:pointer; font-size:12px; padding:0; }
    .sh-empty { color:var(--sh-muted); padding:20px; text-align:center; border:1px dashed var(--sh-border); border-radius:12px; }
    .sh-readonly-note { font-size:11px; color:#fcd34d; margin-top:6px; }
    @keyframes sh-pulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }
  </style>
</head>
<body>
  <div class="sh-shell">
    <div class="sh-card">
      <div class="sh-brand">🗓️ Scheduler</div>
      <div class="sh-sub">Every background job running in this app, in one place — what it does, when it runs, and a switch to turn it off if things feel slow.</div>
    </div>
    <div id="sh-groups"></div>
  </div>

  <script src="/static/scheduler_hub.js"></script>
  <script src="/static/panel_tools.js"></script>
</body>
</html>
